name: Create Resume with Pull request

on:
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4 

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26.8.1
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Create PDF
        run: npm run create_pdf

      - name: Upload PDF to artifact
        uses: actions/upload-artifact@v4
        with:
          name: Resume      
          path: resume.apk     
          retention-days: 30
